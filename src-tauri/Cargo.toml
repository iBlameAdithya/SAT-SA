[package]
name = "satsa_tauri"
version = "1.0.0"
description = "SAT-SA — Supervisory Analytics Tool for SOC Assessment (NTRO / NCIIPC)"
authors = ["SAT-SA Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
csv = "1.3"
sha2 = "0.10"
